<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 620" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&amp;family=Noto+Sans+SC:wght@400;600;700&amp;display=swap');
      text { font-family: 'JetBrains Mono', 'PingFang SC', 'Noto Sans SC', sans-serif; }
      .title { font-size: 18px; font-weight: 700; fill: #ffffff; }
      .subtitle { font-size: 12px; font-weight: 400; fill: #94a3b8; }
      .box-title { font-size: 13px; font-weight: 700; fill: #ffffff; }
      .box-desc { font-size: 10px; font-weight: 400; fill: #94a3b8; }
      .badge { font-size: 9px; font-weight: 700; fill: #fbbf24; }
      .step-num { font-size: 11px; font-weight: 700; fill: #0f172a; }
    </style>
    
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7"/>
    </pattern>
    
    <marker id="arrow" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 9 3, 0 6" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-green" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 9 3, 0 6" fill="#34d399"/>
    </marker>
    <marker id="arrow-orange" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 9 3, 0 6" fill="#fb923c"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#0f172a" rx="12"/>
  <rect width="100%" height="100%" fill="url(#grid)" rx="12"/>

  <!-- Title Block -->
  <g transform="translate(40, 42)">
    <rect x="-10" y="-18" width="6" height="38" fill="#ea580c" rx="2"/>
    <text x="6" y="0" class="title">ZenOPC · 一人公司全生命周期商业闭环全景架构</text>
    <text x="6" y="20" class="subtitle">从自身特点挖掘到自动化现金流系统的 6 阶飞轮演进路径 · 遵循实战工程标准</text>
  </g>

  <!-- Stage Group Boundaries -->
  <!-- Upper Row: Steps 1, 2, 3 -->
  <!-- Step 1: Self-Audit & Positioning -->
  <g transform="translate(40, 110)">
    <rect x="0" y="0" width="300" height="180" rx="8" fill="#0f172a"/>
    <rect x="0" y="0" width="300" height="180" rx="8" fill="rgba(8, 51, 68, 0.45)" stroke="#22d3ee" stroke-width="1.5"/>
    <circle cx="24" cy="28" r="12" fill="#22d3ee"/>
    <text x="24" y="32" text-anchor="middle" class="step-num">01</text>
    <text x="46" y="32" class="box-title">优势盘点与一人定位</text>
    <text x="46" y="48" class="badge">DISCOVERY &amp; POSITIONING</text>
    
    <path d="M 20 62 L 280 62" stroke="#1e293b" stroke-width="1"/>
    <text x="20" y="82" class="box-desc">• 三层冰山模型：萃取 90% 隐性暗知识</text>
    <text x="20" y="102" class="box-desc">• Dan Koe 范式：解决两年前自己的痛点</text>
    <text x="20" y="122" class="box-desc">• 定位公式：Who + When + How → Outcome</text>
    <text x="20" y="142" class="box-desc">• 4道反驳测试：正规军/钱包深度/凌晨原话</text>
    <rect x="20" y="152" width="260" height="18" rx="3" fill="rgba(34, 211, 238, 0.1)"/>
    <text x="150" y="165" text-anchor="middle" font-size="9" fill="#22d3ee" font-weight="600">产出：1 句抗反驳的定位声明 + 痛点清单</text>
  </g>

  <!-- Connect 1 -> 2 -->
  <path d="M 340 200 L 398 200" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2: Value Offer & Pricing -->
  <g transform="translate(410, 110)">
    <rect x="0" y="0" width="300" height="180" rx="8" fill="#0f172a"/>
    <rect x="0" y="0" width="300" height="180" rx="8" fill="rgba(120, 53, 15, 0.35)" stroke="#fbbf24" stroke-width="1.5"/>
    <circle cx="24" cy="28" r="12" fill="#fbbf24"/>
    <text x="24" y="32" text-anchor="middle" class="step-num">02</text>
    <text x="46" y="32" class="box-title">大满贯 Offer 与价值定价</text>
    <text x="46" y="48" class="badge">OFFER ARCHITECTURE</text>
    
    <path d="M 20 62 L 280 62" stroke="#1e293b" stroke-width="1"/>
    <text x="20" y="82" class="box-desc">• Alex Hormozi 价值方程：推高分子压缩分母</text>
    <text x="20" y="102" class="box-desc">• 结果承诺：从卖时间跃迁为卖确定性</text>
    <text x="20" y="122" class="box-desc">• 溢价四件套：核心方案 + 赠品堆叠 + 反向对赌</text>
    <text x="20" y="142" class="box-desc">• 产品阶梯：L1免费钩子 ➔ L2轻课 ➔ L3核心包</text>
    <rect x="20" y="152" width="260" height="18" rx="3" fill="rgba(251, 191, 36, 0.1)"/>
    <text x="150" y="165" text-anchor="middle" font-size="9" fill="#fbbf24" font-weight="600">产出：无法拒绝的 Grand Slam Offer 方案</text>
  </g>

  <!-- Connect 2 -> 3 -->
  <path d="M 710 200 L 768 200" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3: Audience & Trust Assets -->
  <g transform="translate(780, 110)">
    <rect x="0" y="0" width="260" height="180" rx="8" fill="#0f172a"/>
    <rect x="0" y="0" width="260" height="180" rx="8" fill="rgba(76, 29, 149, 0.4)" stroke="#a78bfa" stroke-width="1.5"/>
    <circle cx="24" cy="28" r="12" fill="#a78bfa"/>
    <text x="24" y="32" text-anchor="middle" class="step-num">03</text>
    <text x="46" y="32" class="box-title">个人IP与信任资产</text>
    <text x="46" y="48" class="badge" fill="#a78bfa">CONTENT ENGINE</text>
    
    <path d="M 20 62 L 240 62" stroke="#1e293b" stroke-width="1"/>
    <text x="20" y="82" class="box-desc">• 告别泛流量自媒体与算法毒药</text>
    <text x="20" y="102" class="box-desc">• 三大内容支柱：痛点 30% + 重构 30% + 机制 40%</text>
    <text x="20" y="122" class="box-desc">• Content Vault：事实/POV/异议库</text>
    <text x="20" y="142" class="box-desc">• 一鱼多吃：长文 ➔ 图文 ➔ 脚本</text>
    <rect x="20" y="152" width="220" height="18" rx="3" fill="rgba(167, 139, 250, 0.1)"/>
    <text x="130" y="165" text-anchor="middle" font-size="9" fill="#a78bfa" font-weight="600">产出：24篇常青资产与AI流水线</text>
  </g>

  <!-- Loop Down Connector from 3 to 4 -->
  <path d="M 910 290 L 910 330 L 910 350 L 890 350 L 710 350 L 340 350 L 190 350 L 190 398" fill="none" stroke="#fb923c" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-orange)"/>
  <rect x="500" y="340" width="160" height="20" rx="4" fill="#0f172a" stroke="#fb923c" stroke-width="1"/>
  <text x="580" y="354" text-anchor="middle" font-size="10" fill="#fb923c" font-weight="600">公域转私域 Lead Magnet</text>

  <!-- Lower Row: Steps 4, 5, 6 -->
  <!-- Step 4: Cold Start & Conversion -->
  <g transform="translate(40, 410)">
    <rect x="0" y="0" width="300" height="180" rx="8" fill="#0f172a"/>
    <rect x="0" y="0" width="300" height="180" rx="8" fill="rgba(6, 78, 59, 0.45)" stroke="#34d399" stroke-width="1.5"/>
    <circle cx="24" cy="28" r="12" fill="#34d399"/>
    <text x="24" y="32" text-anchor="middle" class="step-num">04</text>
    <text x="46" y="32" class="box-title">冷启动与无痛成交</text>
    <text x="46" y="48" class="badge" fill="#34d399">CONVERSION FUNNEL</text>
    
    <path d="M 20 62 L 280 62" stroke="#1e293b" stroke-width="1"/>
    <text x="20" y="82" class="box-desc">• 特洛伊木马微审计：先送30%成果破冰</text>
    <text x="20" y="102" class="box-desc">• 医生问诊 5 步法：破冰 ➔ 算账 ➔ 筛选 ➔ 处方</text>
    <text x="20" y="122" class="box-desc">• 高转化单页落地页：七段式心理递进</text>
    <text x="20" y="142" class="box-desc">• 黄金 72 小时培育序列自动激活新客</text>
    <rect x="20" y="152" width="260" height="18" rx="3" fill="rgba(52, 211, 153, 0.1)"/>
    <text x="150" y="165" text-anchor="middle" font-size="9" fill="#34d399" font-weight="600">产出：首批 100 种子线索与首批付费客户</text>
  </g>

  <!-- Connect 4 -> 5 -->
  <path d="M 340 500 L 398 500" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- Step 5: Automated Delivery & Finance -->
  <g transform="translate(410, 410)">
    <rect x="0" y="0" width="300" height="180" rx="8" fill="#0f172a"/>
    <rect x="0" y="0" width="300" height="180" rx="8" fill="rgba(8, 51, 68, 0.45)" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="24" cy="28" r="12" fill="#38bdf8"/>
    <text x="24" y="32" text-anchor="middle" class="step-num">05</text>
    <text x="46" y="32" class="box-title">极简交付与财税合规</text>
    <text x="46" y="48" class="badge" fill="#38bdf8">SCALE &amp; COMPLIANCE</text>
    
    <path d="M 20 62 L 280 62" stroke="#1e293b" stroke-width="1"/>
    <text x="20" y="82" class="box-desc">• 交付四大能力：标准化/模板化/自动化/外包</text>
    <text x="20" y="102" class="box-desc">• Notion Client Portal：异步交付消灭即时打扰</text>
    <text x="20" y="122" class="box-desc">• 四账户隔离：税费15% / 工具15% / 安全垫20%</text>
    <text x="20" y="142" class="box-desc">• 交付即获客：黄金索要好评点与转介绍机制</text>
    <rect x="20" y="152" width="260" height="18" rx="3" fill="rgba(56, 189, 248, 0.1)"/>
    <text x="150" y="165" text-anchor="middle" font-size="9" fill="#38bdf8" font-weight="600">产出：单兵交付降本90% + 6个月财务安全垫</text>
  </g>

  <!-- Connect 5 -> 6 -->
  <path d="M 710 500 L 768 500" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- Step 6: Flywheel & Endgame -->
  <g transform="translate(780, 410)">
    <rect x="0" y="0" width="260" height="180" rx="8" fill="#0f172a"/>
    <rect x="0" y="0" width="260" height="180" rx="8" fill="rgba(234, 88, 12, 0.35)" stroke="#ea580c" stroke-width="1.5"/>
    <circle cx="24" cy="28" r="12" fill="#ea580c"/>
    <text x="24" y="32" text-anchor="middle" class="step-num">06</text>
    <text x="46" y="32" class="box-title">复利飞轮与终局自由</text>
    <text x="46" y="48" class="badge" fill="#ea580c">FLYWHEEL &amp; ENDGAME</text>
    
    <path d="M 20 62 L 240 62" stroke="#1e293b" stroke-width="1"/>
    <text x="20" y="82" class="box-desc">• 四大自动化杠杆联动无缝协同</text>
    <text x="20" y="102" class="box-desc">• 边际成本递减 × 资产溢价递增</text>
    <text x="20" y="122" class="box-desc">• 终局抉择：Paul Jarvis 小而美自由</text>
    <text x="20" y="142" class="box-desc">• 资产化退出：Levelsio 微型并购</text>
    <rect x="20" y="152" width="220" height="18" rx="3" fill="rgba(234, 88, 12, 0.1)"/>
    <text x="130" y="165" text-anchor="middle" font-size="9" fill="#ea580c" font-weight="600">终局：真正掌控生活与时间的职业自由</text>
  </g>
</svg>
