    <text x="24" y="230" fill="#e2e8f0" font-size="11" font-weight="600" font-family="system-ui, -apple-system, sans-serif">私域留存载体</text>
    <text x="24" y="248" fill="#94a3b8" font-size="10" font-family="system-ui, -apple-system, sans-serif">• 个人微信 (标签化精准备注)</text>
    <text x="24" y="262" fill="#94a3b8" font-size="10" font-family="system-ui, -apple-system, sans-serif">• 专属 Newsletter (防封私有资产)</text>

    <!-- 底部指标 -->
    <rect x="14" y="284" width="187" height="52" rx="6" fill="#0f172a" stroke="#0891b2" stroke-width="1"/>
    <text x="24" y="303" fill="#22d3ee" font-size="10" font-weight="600" font-family="system-ui, -apple-system, sans-serif">核心交付指标：</text>
    <text x="24" y="321" fill="#cbd5e1" font-size="10" font-family="system-ui, -apple-system, sans-serif">公域转私域加微率 &gt; 15%</text>
  </g>

  <!-- 阶段 3: 黄金 72 小时培育 -->
  <g transform="translate(510, 95)" filter="url(#cardShadow)">
    <rect width="215" height="350" rx="12" fill="url(#gStage3)" stroke="#8b5cf6" stroke-width="1.2" stroke-opacity="0.4"/>
    <rect x="14" y="14" width="32" height="24" rx="6" fill="#8b5cf6" />
