    <text x="24" y="303" fill="#60a5fa" font-size="10" font-weight="600" font-family="system-ui, -apple-system, sans-serif">核心交付指标：</text>
    <text x="24" y="321" fill="#cbd5e1" font-size="10" font-family="system-ui, -apple-system, sans-serif">每周产出 2 篇深度认知复盘</text>
  </g>

  <!-- 阶段 2: 极窄私域筛选池 -->
  <g transform="translate(275, 95)" filter="url(#cardShadow)">
    <rect width="215" height="350" rx="12" fill="url(#gStage2)" stroke="#06b6d4" stroke-width="1.2" stroke-opacity="0.4"/>
    <rect x="14" y="14" width="32" height="24" rx="6" fill="#06b6d4" />
    <text x="30" y="30" fill="#0f172a" font-size="12" font-weight="700" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">02</text>
    <text x="54" y="31" fill="#67e8f9" font-size="14" font-weight="700" font-family="system-ui, -apple-system, sans-serif">极窄私域筛选池</text>
