    <text x="24" y="122" fill="#94a3b8" font-size="10" font-family="system-ui, -apple-system, sans-serif">• 帮助客户厘清关键卡点诱因</text>

    <rect x="14" y="140" width="187" height="62" rx="6" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="0.8"/>
    <text x="24" y="160" fill="#e2e8f0" font-size="11" font-weight="600" font-family="system-ui, -apple-system, sans-serif">阶段 2: 处方化方案交付</text>
    <text x="24" y="178" fill="#94a3b8" font-size="10" font-family="system-ui, -apple-system, sans-serif">• 开出针对性疗愈路线图</text>
    <text x="24" y="192" fill="#94a3b8" font-size="10" font-family="system-ui, -apple-system, sans-serif">• 匹配结果承诺与阶梯产品</text>

    <rect x="14" y="210" width="187" height="62" rx="6" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="0.8"/>
    <text x="24" y="230" fill="#e2e8f0" font-size="11" font-weight="600" font-family="system-ui, -apple-system, sans-serif">阶段 3: 零阻力履约交付</text>
    <text x="24" y="248" fill="#94a3b8" font-size="10" font-family="system-ui, -apple-system, sans-serif">• 无风险退款承诺 / 超预期兑现</text>
    <text x="24" y="262" fill="#94a3b8" font-size="10" font-family="system-ui, -apple-system, sans-serif">• 沉淀真实证言转动转介绍飞轮</text>

