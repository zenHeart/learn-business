    <text x="14" y="54" fill="#64748b" font-size="11" font-family="system-ui, -apple-system, sans-serif">信任快速爬坡序列 (Nurturing)</text>

    <!-- 子要素卡片 -->
    <rect x="14" y="70" width="187" height="62" rx="6" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="0.8"/>
    <text x="24" y="90" fill="#e2e8f0" font-size="11" font-weight="600" font-family="system-ui, -apple-system, sans-serif">Day 1: 即时履约与赠礼</text>
    <text x="24" y="108" fill="#94a3b8" font-size="10" font-family="system-ui, -apple-system, sans-serif">• 10分钟内秒送承诺资料</text>
    <text x="24" y="122" fill="#94a3b8" font-size="10" font-family="system-ui, -apple-system, sans-serif">• 附带意料之外的破冰小锦囊</text>

    <rect x="14" y="140" width="187" height="62" rx="6" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="0.8"/>
    <text x="24" y="160" fill="#e2e8f0" font-size="11" font-weight="600" font-family="system-ui, -apple-system, sans-serif">Day 2: 真实穿透案例</text>
    <text x="24" y="178" fill="#94a3b8" font-size="10" font-family="system-ui, -apple-system, sans-serif">• 拆解同类背景客户转型实录</text>
    <text x="24" y="192" fill="#94a3b8" font-size="10" font-family="system-ui, -apple-system, sans-serif">• 呈现从迷茫到交付的完整闭环</text>

    <rect x="14" y="210" width="187" height="62" rx="6" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="0.8"/>
    <text x="24" y="230" fill="#e2e8f0" font-size="11" font-weight="600" font-family="system-ui, -apple-system, sans-serif">Day 3: 观念对齐与排雷</text>
    <text x="24" y="248" fill="#94a3b8" font-size="10" font-family="system-ui, -apple-system, sans-serif">• 瓦解常见执行心魔与盲区</text>
    <text x="24" y="262" fill="#94a3b8" font-size="10" font-family="system-ui, -apple-system, sans-serif">• 抛出深度 1对1 诊断机会邀请</text>

    <!-- 底部指标 -->
    <rect x="14" y="284" width="187" height="52" rx="6" fill="#0f172a" stroke="#6d28d9" stroke-width="1"/>
    <text x="24" y="303" fill="#a78bfa" font-size="10" font-weight="600" font-family="system-ui, -apple-system, sans-serif">核心交付指标：</text>
    <text x="24" y="321" fill="#cbd5e1" font-size="10" font-family="system-ui, -apple-system, sans-serif">朋友圈/私信互动率 &gt; 35%</text>
  </g>

  <!-- 阶段 4: 医生问诊无痛成交 -->
  <g transform="translate(745, 95)" filter="url(#cardShadow)">
    <rect width="215" height="350" rx="12" fill="url(#gStage4)" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.4"/>
    <rect x="14" y="14" width="32" height="24" rx="6" fill="#10b981" />
    <text x="30" y="30" fill="#0f172a" font-size="12" font-weight="700" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">04</text>
    <text x="54" y="31" fill="#6ee7b7" font-size="14" font-weight="700" font-family="system-ui, -apple-system, sans-serif">医生问诊无痛成交</text>
    <text x="14" y="54" fill="#64748b" font-size="11" font-family="system-ui, -apple-system, sans-serif">匹配大满贯 Offer (Conversion)</text>

    <!-- 子要素卡片 -->
    <rect x="14" y="70" width="187" height="62" rx="6" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="0.8"/>
    <text x="24" y="90" fill="#e2e8f0" font-size="11" font-weight="600" font-family="system-ui, -apple-system, sans-serif">阶段 1: 瓶颈事实诊断</text>
