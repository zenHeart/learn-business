  <line x1="490" y1="270" x2="508" y2="270" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="725" y1="270" x2="743" y2="270" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- 底部对比横幅 -->
  <g transform="translate(40, 465)">
    <rect width="920" height="90" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    
    <!-- 传统流量模式对比 -->
    <g transform="translate(20, 15)">
      <rect x="0" y="0" width="70" height="22" rx="4" fill="#dc2626" fill-opacity="0.2" stroke="#ef4444" stroke-width="1"/>
      <text x="35" y="15" fill="#fca5a5" font-size="11" font-weight="600" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">传统流量</text>
