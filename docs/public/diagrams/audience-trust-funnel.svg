    <text x="24" y="108" fill="#94a3b8" font-size="10" font-family="system-ui, -apple-system, sans-serif">• 生产力 Checklist / 自动化模板</text>
    <text x="24" y="122" fill="#94a3b8" font-size="10" font-family="system-ui, -apple-system, sans-serif">• 极简 10 分钟问题自诊断表</text>

    <rect x="14" y="140" width="187" height="62" rx="6" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="0.8"/>
