      </text>
    </g>

    <line x1="20" y1="45" x2="900" y2="45" stroke="#1e293b" stroke-width="1" />

    <!-- ZenOPC 信任模式 -->
    <g transform="translate(20, 55)">
      <rect x="0" y="0" width="70" height="22" rx="4" fill="#059669" fill-opacity="0.2" stroke="#10b981" stroke-width="1"/>
      <text x="35" y="15" fill="#6ee7b7" font-size="11" font-weight="600" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">ZenOPC</text>
      <text x="85" y="16" fill="#f1f5f9" font-size="12" font-weight="500" font-family="system-ui, -apple-system, sans-serif">
        300~500 精准专业受众 ➔ 50个高信任私域好友 ➔ 5~10个高客单闭环成交（¥20,000+ 稳定月利润）
