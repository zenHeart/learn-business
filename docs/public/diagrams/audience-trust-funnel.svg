    <text x="24" y="303" fill="#34d399" font-size="10" font-weight="600" font-family="system-ui, -apple-system, sans-serif">核心交付指标：</text>
    <text x="24" y="321" fill="#cbd5e1" font-size="10" font-family="system-ui, -apple-system, sans-serif">深度咨询成交转化率 &gt; 25%</text>
