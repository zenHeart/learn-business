<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <pattern id="grid2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.6"/>
    </pattern>

    <filter id="cardShadow2" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.45" />
    </filter>

    <linearGradient id="founderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.08"/>
    </linearGradient>

    <linearGradient id="agentContentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="agentCrmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="agentDeliveryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0.08"/>
    </linearGradient>

    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#fbbf24" />
    </marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="1000" height="600" fill="url(#bgGrad2)" />
  <rect width="1000" height="600" fill="url(#grid2)" />

  <!-- 顶部标题 -->
  <g transform="translate(40, 26)">
    <rect x="0" y="0" width="8" height="38" rx="4" fill="#f59e0b" />
    <text x="20" y="24" fill="#f8fafc" font-size="20" font-weight="700" font-family="system-ui, -apple-system, sans-serif">
      ZenOPC 人机协作与自动化交付中枢
    </text>
    <text x="20" y="42" fill="#94a3b8" font-size="12" font-family="system-ui, -apple-system, sans-serif">
      一人公司杠杆力倍增体系 · 创始人保留关键审美与共情 · AI Agent 集群接管标准化重复流水线
    </text>
    <rect x="740" y="4" width="220" height="28" rx="14" fill="#78350f" fill-opacity="0.3" stroke="#f59e0b" stroke-width="1"/>
    <text x="850" y="22" fill="#fbbf24" font-size="11" font-weight="600" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
      边际交付成本逼近于零
    </text>
  </g>

  <!-- 创始人中枢 (Founder Decision Hub) -->
  <g transform="translate(40, 88)" filter="url(#cardShadow2)">
    <rect width="920" height="96" rx="12" fill="url(#founderGrad)" stroke="#f59e0b" stroke-width="1.2" stroke-opacity="0.5"/>
    <circle cx="45" cy="48" r="24" fill="#b45309" fill-opacity="0.4" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="45" y="53" fill="#fef3c7" font-size="16" font-weight="700" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">Ω</text>
    
    <text x="85" y="38" fill="#fde68a" font-size="16" font-weight="700" font-family="system-ui, -apple-system, sans-serif">创始人智慧与决策中枢 (The Solopreneur Core)</text>
    <text x="85" y="58" fill="#cbd5e1" font-size="12" font-family="system-ui, -apple-system, sans-serif">
      唯一不可被 AI 替代的护城河：战略定位与取舍、高阶共情问诊、内容洞察深度、终极审美标准与伦理声誉
    </text>
    
    <!-- 创始人输出通道标签 -->
    <rect x="85" y="68" width="130" height="20" rx="4" fill="#1e293b" stroke="#475569" stroke-width="0.8"/>
    <text x="150" y="82" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">🎯 战略与目标对齐</text>

    <rect x="225" y="68" width="130" height="20" rx="4" fill="#1e293b" stroke="#475569" stroke-width="0.8"/>
    <text x="290" y="82" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">💡 个人隐性知识库</text>

    <rect x="365" y="68" width="130" height="20" rx="4" fill="#1e293b" stroke="#475569" stroke-width="0.8"/>
    <text x="430" y="82" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">🤝 1对1深度咨询问诊</text>

    <rect x="505" y="68" width="130" height="20" rx="4" fill="#1e293b" stroke="#475569" stroke-width="0.8"/>
    <text x="570" y="82" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">⚖️ 最终交付质量验收</text>
  </g>

  <!-- 连接向下箭头 -->
  <line x1="200" y1="185" x2="200" y2="215" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrowAmber)" />
  <line x1="500" y1="185" x2="500" y2="215" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrowAmber)" />
  <line x1="800" y1="185" x2="800" y2="215" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrowAmber)" />

  <!-- 中间层: 三大 AI Agent 集群 -->
  <!-- 1. 内容与声量 Agent -->
  <g transform="translate(40, 220)" filter="url(#cardShadow2)">
    <rect width="290" height="235" rx="12" fill="url(#agentContentGrad)" stroke="#3b82f6" stroke-width="1.2" stroke-opacity="0.5"/>
    <rect x="14" y="14" width="28" height="22" rx="4" fill="#3b82f6" />
    <text x="28" y="29" fill="#fff" font-size="11" font-weight="700" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">A1</text>
    <text x="50" y="30" fill="#93c5fd" font-size="14" font-weight="700" font-family="system-ui, -apple-system, sans-serif">内容与声量 Agent</text>
    <text x="14" y="52" fill="#64748b" font-size="11" font-family="system-ui, -apple-system, sans-serif">获客流水线与多平台分发</text>

    <rect x="14" y="66" width="262" height="48" rx="6" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="0.8"/>
    <text x="24" y="84" fill="#e2e8f0" font-size="11" font-weight="600" font-family="system-ui, -apple-system, sans-serif">1. 选题雷达与资料检索</text>
    <text x="24" y="102" fill="#94a3b8" font-size="10" font-family="system-ui, -apple-system, sans-serif">全网痛点爬取 · 竞品评论区高频痛点扫描</text>

    <rect x="14" y="122" width="262" height="48" rx="6" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="0.8"/>
    <text x="24" y="140" fill="#e2e8f0" font-size="11" font-weight="600" font-family="system-ui, -apple-system, sans-serif">2. 认知长文草稿提炼</text>
    <text x="24" y="158" fill="#94a3b8" font-size="10" font-family="system-ui, -apple-system, sans-serif">按“Hook+重构+证据”框架产出初始骨架</text>

    <rect x="14" y="178" width="262" height="48" rx="6" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="0.8"/>
    <text x="24" y="196" fill="#e2e8f0" font-size="11" font-weight="600" font-family="system-ui, -apple-system, sans-serif">3. 一鱼多吃跨平台裁切</text>
    <text x="24" y="214" fill="#94a3b8" font-size="10" font-family="system-ui, -apple-system, sans-serif">长文拆解小红书图文 / 朋友圈短思 / 推文</text>
  </g>

  <!-- 2. 转化与线索 Agent -->
  <g transform="translate(355, 220)" filter="url(#cardShadow2)">
    <rect width="290" height="235" rx="12" fill="url(#agentCrmGrad)" stroke="#8b5cf6" stroke-width="1.2" stroke-opacity="0.5"/>
    <rect x="14" y="14" width="28" height="22" rx="4" fill="#8b5cf6" />
    <text x="28" y="29" fill="#fff" font-size="11" font-weight="700" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">A2</text>
    <text x="50" y="30" fill="#c4b5fd" font-size="14" font-weight="700" font-family="system-ui, -apple-system, sans-serif">转化与线索 CRM Agent</text>
    <text x="14" y="52" fill="#64748b" font-size="11" font-family="system-ui, -apple-system, sans-serif">引流钩子与培育自动化</text>

    <rect x="14" y="66" width="262" height="48" rx="6" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="0.8"/>
    <text x="24" y="84" fill="#e2e8f0" font-size="11" font-weight="600" font-family="system-ui, -apple-system, sans-serif">1. 引流钩子秒级履约</text>
    <text x="24" y="102" fill="#94a3b8" font-size="10" font-family="system-ui, -apple-system, sans-serif">关键词识别 · 自动发送 Notion/PDF 资料包</text>

    <rect x="14" y="122" width="262" height="48" rx="6" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="0.8"/>
    <text x="24" y="140" fill="#e2e8f0" font-size="11" font-weight="600" font-family="system-ui, -apple-system, sans-serif">2. 意向标签与动态分类</text>
    <text x="24" y="158" fill="#94a3b8" font-size="10" font-family="system-ui, -apple-system, sans-serif">根据自测问卷打标（行业/痛点/预算范围）</text>

    <rect x="14" y="178" width="262" height="48" rx="6" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="0.8"/>
    <text x="24" y="196" fill="#e2e8f0" font-size="11" font-weight="600" font-family="system-ui, -apple-system, sans-serif">3. 72小时智能关怀序列</text>
    <text x="24" y="214" fill="#94a3b8" font-size="10" font-family="system-ui, -apple-system, sans-serif">定期触发成功案例推送 · 提示预约创始人问诊</text>
  </g>

  <!-- 3. 交付与产品 Agent -->
  <g transform="translate(670, 220)" filter="url(#cardShadow2)">
    <rect width="290" height="235" rx="12" fill="url(#agentDeliveryGrad)" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.5"/>
    <rect x="14" y="14" width="28" height="22" rx="4" fill="#10b981" />
    <text x="28" y="29" fill="#0f172a" font-size="11" font-weight="700" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">A3</text>
    <text x="50" y="30" fill="#6ee7b7" font-size="14" font-weight="700" font-family="system-ui, -apple-system, sans-serif">交付与产品 Agent</text>
    <text x="14" y="52" fill="#64748b" font-size="11" font-family="system-ui, -apple-system, sans-serif">履约模版化与陪伴答疑</text>

    <rect x="14" y="66" width="262" height="48" rx="6" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="0.8"/>
    <text x="24" y="84" fill="#e2e8f0" font-size="11" font-weight="600" font-family="system-ui, -apple-system, sans-serif">1. 交付物初稿自动化组装</text>
    <text x="24" y="102" fill="#94a3b8" font-size="10" font-family="system-ui, -apple-system, sans-serif">诊断报告 · 定制方案草案 · 脚本库自动拼装</text>

    <rect x="14" y="122" width="262" height="48" rx="6" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="0.8"/>
    <text x="24" y="140" fill="#e2e8f0" font-size="11" font-weight="600" font-family="system-ui, -apple-system, sans-serif">2. 7x24 智能陪伴答疑助理</text>
    <text x="24" y="158" fill="#94a3b8" font-size="10" font-family="system-ui, -apple-system, sans-serif">基于创始人知识库（飞书/Dify）解答 80% 基础提问</text>

    <rect x="14" y="178" width="262" height="48" rx="6" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="0.8"/>
    <text x="24" y="196" fill="#e2e8f0" font-size="11" font-weight="600" font-family="system-ui, -apple-system, sans-serif">3. 满意度回访与证言收集</text>
    <text x="24" y="214" fill="#94a3b8" font-size="10" font-family="system-ui, -apple-system, sans-serif">交付节点自动触发复盘问卷 · 提取高质量口碑证据</text>
  </g>

  <!-- 连接向下箭头到技术栈底座 -->
  <line x1="500" y1="460" x2="500" y2="475" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowCyan)" />

  <!-- 底部: 现代 AI 一人公司基础设施底座 -->
  <g transform="translate(40, 480)">
    <rect width="920" height="92" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    
    <g transform="translate(20, 15)">
      <text x="0" y="16" fill="#38bdf8" font-size="12" font-weight="700" font-family="system-ui, -apple-system, sans-serif">核心技术栈与连接器：</text>
      
      <!-- 标签 1 -->
      <rect x="135" y="0" width="165" height="26" rx="4" fill="#1e293b" stroke="#475569" stroke-width="0.8"/>
      <text x="145" y="17" fill="#f1f5f9" font-size="11" font-family="system-ui, -apple-system, sans-serif">🧠 核心LLM: Claude / GPT</text>

      <!-- 标签 2 -->
      <rect x="310" y="0" width="185" height="26" rx="4" fill="#1e293b" stroke="#475569" stroke-width="0.8"/>
      <text x="320" y="17" fill="#f1f5f9" font-size="11" font-family="system-ui, -apple-system, sans-serif">⚡ 工作流: Make / Dify / Zapier</text>

      <!-- 标签 3 -->
      <rect x="505" y="0" width="195" height="26" rx="4" fill="#1e293b" stroke="#475569" stroke-width="0.8"/>
      <text x="515" y="17" fill="#f1f5f9" font-size="11" font-family="system-ui, -apple-system, sans-serif">🗄️ 知识库: Notion / 飞书多维表格</text>

      <!-- 标签 4 -->
      <rect x="710" y="0" width="190" height="26" rx="4" fill="#1e293b" stroke="#475569" stroke-width="0.8"/>
      <text x="720" y="17" fill="#f1f5f9" font-size="11" font-family="system-ui, -apple-system, sans-serif">🚀 极速部署: VitePress / Void</text>
    </g>

    <!-- 收益总结 -->
    <g transform="translate(20, 52)">
      <line x1="0" y1="0" x2="880" y2="0" stroke="#1e293b" stroke-width="1" />
      <text x="0" y="24" fill="#10b981" font-size="12" font-weight="600" font-family="system-ui, -apple-system, sans-serif">一人公司杠杆终极收益：</text>
      <text x="140" y="24" fill="#94a3b8" font-size="11" font-family="system-ui, -apple-system, sans-serif">
        创始人每周精力投入从 60+ 小时压缩至 15~20 小时精要专注，交付容量扩充 5~10 倍，真正达成【时间自由 + 高现金流】双赢。
      </text>
    </g>
  </g>
</svg>
