<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="zenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5722"/>
      <stop offset="50%" stop-color="#FF9800"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Flywheel Dynamic Arc -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="url(#ringGrad)" stroke-width="4" stroke-dasharray="190 70" stroke-linecap="round"/>
  
  <!-- Inner Dynamic Ring -->
  <circle cx="50" cy="50" r="32" fill="none" stroke="url(#zenGrad)" stroke-width="3" stroke-dasharray="120 80" stroke-linecap="round" transform="rotate(45 50 50)"/>
  
  <!-- Center Core: Solopreneur & Autonomous Node -->
  <circle cx="50" cy="38" r="8" fill="url(#zenGrad)"/>
  <path d="M34 68 C34 54, 66 54, 66 68 Z" fill="url(#zenGrad)"/>
  
  <!-- Growth Spark -->
  <polygon points="68,26 73,34 65,34" fill="#FFD700" filter="url(#glow)"/>
</svg>
